<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlappyBird — Nova Arcade</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:#0b0924;color:#f8fafc;display:flex;justify-content:center;padding:24px}
    .shell{width:min(1180px,100%)}.back{display:inline-block;margin-bottom:14px;color:#bae6fd;text-decoration:none;font-weight:700}
    .layout{display:grid;grid-template-columns:minmax(0,860px) 300px;gap:20px;align-items:start}
    canvas{display:block;width:100%;height:auto;aspect-ratio:860/540;border-radius:14px;border:1px solid #475569;box-shadow:0 18px 48px #0006;touch-action:manipulation;cursor:pointer}
    .panel{background:#161c38;border:1px solid #ffffff24;border-radius:14px;padding:18px}.panel h2{font-size:16px;margin:0 0 12px}
    .map-btn{width:100%;padding:11px 12px;margin-bottom:8px;border-radius:9px;border:1px solid #64748b;background:#ffffff12;color:#fff;text-align:left;font-weight:700;cursor:pointer}.map-btn.active{border-color:#38bdf8;background:#38bdf82a}
    .scores{list-style:none;margin:10px 0 0;padding:0;border:1px solid #ffffff1f;border-radius:9px;overflow:hidden}.scores li{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid #ffffff12;font-size:13px}.scores li:last-child{border:0}.hint{color:#cbd5e1;font-size:12px;margin-top:9px}.empty{color:#94a3b8;padding:12px;font-size:13px}.player-name{font-size:13px;color:#bae6fd;margin:-3px 0 10px}
    .name-dialog{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#020617cc}.name-dialog[hidden]{display:none}.dialog-card{width:min(360px,100%);padding:22px;border-radius:16px;background:#172033;border:1px solid #ffffff30;box-shadow:0 20px 60px #0008}.dialog-card h2{margin:0 0 8px}.dialog-card p{color:#cbd5e1;font-size:14px}.dialog-card label{display:block;margin:14px 0 6px;font-size:13px}.dialog-card input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #64748b;border-radius:8px;background:#0f172a;color:#fff;font:inherit}.dialog-card button{margin-top:14px;padding:10px 14px;border:0;border-radius:8px;background:#38bdf8;color:#082f49;font-weight:800;cursor:pointer}
    @media(max-width:960px){.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="index.html">← Nova Arcade</a>
    <div class="layout">
      <div><canvas id="game" aria-label="FlappyBird. Click, tap, or press Space to flap."></canvas><div class="hint">Click / Tap / Space / Arrow Up to flap · R to restart</div></div>
      <aside class="panel">
        <h2>Select Map</h2>
        <button class="map-btn active" id="barnBtn">🌾 Farmyard Flight</button>
        <button class="map-btn" id="bathBtn">🚽 Bathroom Blitz</button>
        <h2 style="margin-top:18px">Your High Scores</h2>
        <div class="player-name" id="playerName"></div>
        <ul class="scores" id="scores"></ul>
      </aside>
    </div>
  </main>
  <div class="name-dialog" id="nameDialog" hidden>
    <form class="dialog-card" id="nameForm">
      <h2>Save your score</h2><p>What username should appear beside your FlappyBird high scores?</p>
      <label for="username">Username</label><input id="username" name="username" maxlength="20" autocomplete="nickname" required />
      <button type="submit">Save score</button>
    </form>
  </div>
<script>
(()=>{
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  const W=860,H=540,PLAY=472,GROUND=68,STORE='flappybird_personal_scores_v1',NAME_KEY='flappybird_player_name_v1';
  let map='barn',state='TITLE',score=0,scroll=0,time=0,last=performance.now(),obstacles=[],savedPending=false;
  let bird={x:215,y:215,vy:0,r:15,rot:0};
  const $=id=>document.getElementById(id);
  function readScores(){try{const data=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(data)?data.filter(x=>x&&Number.isFinite(+x.score)).map(x=>({...x,score:+x.score})).sort((a,b)=>b.score-a.score).slice(0,10):[]}catch{return[]}}
  function renderScores(){const name=localStorage.getItem(NAME_KEY)||'';$('playerName').textContent=name?`Player: ${name}`:'Scores are saved on this device';const rows=readScores();$('scores').innerHTML=rows.length?rows.map((entry,i)=>`<li><span>#${i+1} ${escapeText(entry.name)} · ${entry.map}</span><strong>${entry.score}</strong></li>`).join(''):'<li class="empty">No personal scores yet</li>'}
  function escapeText(text){const node=document.createElement('span');node.textContent=String(text);return node.innerHTML}
  function saveScore(){if(score<=0||savedPending)return;savedPending=true;const name=localStorage.getItem(NAME_KEY);if(name){storeScore(name);return}$('username').value='';$('nameDialog').hidden=false;$('username').focus()}
  function storeScore(name){const rows=readScores();rows.push({name,map:map==='barn'?'Farm':'Bathroom',score});rows.sort((a,b)=>b.score-a.score);try{localStorage.setItem(NAME_KEY,name);localStorage.setItem(STORE,JSON.stringify(rows.slice(0,10)))}catch{}$('nameDialog').hidden=true;renderScores()}
  $('nameForm').addEventListener('submit',e=>{e.preventDefault();const name=$('username').value.trim().slice(0,20);if(name)storeScore(name)});
  function reset(next='TITLE'){state=next;score=0;scroll=0;obstacles=[];savedPending=false;bird={x:215,y:215,vy:0,r:15,rot:0}}
  function flap(){if(state!=='PLAYING')reset('PLAYING');bird.vy=-465}
  $('barnBtn').onclick=()=>{map='barn';$('barnBtn').classList.add('active');$('bathBtn').classList.remove('active');reset()};
  $('bathBtn').onclick=()=>{map='bathroom';$('bathBtn').classList.add('active');$('barnBtn').classList.remove('active');reset()};
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
  window.addEventListener('keydown',e=>{if(e.repeat)return;if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();flap()}else if(e.code==='KeyR'){reset('PLAYING');flap()}});
  function spawn(){const lastObs=obstacles[obstacles.length-1],gap=Math.max(138,166-score),margin=78+gap/2;if(!lastObs||W-lastObs.x>=290)obstacles.push({x:W+30,w:72,gap,y:margin+Math.random()*(PLAY-margin*2),passed:false})}
  function collides(o){if(bird.x+bird.r<o.x+7||bird.x-bird.r>o.x+o.w-7)return false;return bird.y-bird.r<o.y-o.gap/2||bird.y+bird.r>o.y+o.gap/2}
  function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#ffffffc9';ctx.beginPath();ctx.arc(0,12,20,Math.PI,0);ctx.arc(25,3,28,Math.PI,0);ctx.arc(53,13,20,Math.PI,0);ctx.lineTo(73,21);ctx.lineTo(-20,21);ctx.closePath();ctx.fill();ctx.restore()}
  function drawFarm(){const sky=ctx.createLinearGradient(0,0,0,PLAY);sky.addColorStop(0,'#63bdf1');sky.addColorStop(.72,'#d8eff9');sky.addColorStop(1,'#f3df9c');ctx.fillStyle=sky;ctx.fillRect(0,0,W,PLAY);ctx.fillStyle='#fff2a6';ctx.beginPath();ctx.arc(725,88,38,0,Math.PI*2);ctx.fill();cloud(100-scroll*.08%980,90,.9);cloud(470-scroll*.06%1000,130,.65);ctx.fillStyle='#91ca70';ctx.beginPath();ctx.moveTo(0,300);for(let x=0;x<=W;x+=20)ctx.lineTo(x,292+Math.sin((x+scroll*.12)/90)*18);ctx.lineTo(W,PLAY);ctx.lineTo(0,PLAY);ctx.fill();ctx.fillStyle='#65ad51';ctx.beginPath();ctx.moveTo(0,338);for(let x=0;x<=W;x+=20)ctx.lineTo(x,326+Math.sin((x+scroll*.2)/110)*20);ctx.lineTo(W,PLAY);ctx.lineTo(0,PLAY);ctx.fill();const bx=560-scroll*.12%1120;ctx.fillStyle='#a63d32';ctx.fillRect(bx,238,138,94);ctx.fillStyle='#71352f';ctx.beginPath();ctx.moveTo(bx-12,240);ctx.lineTo(bx+69,184);ctx.lineTo(bx+150,240);ctx.closePath();ctx.fill();ctx.fillStyle='#4d963e';ctx.fillRect(0,350,W,122);for(let row=0;row<5;row++){const y=374+row*30,off=scroll*(.7+row*.08)%46;ctx.fillStyle='#d9ae45';ctx.fillRect(0,y,W,3);ctx.strokeStyle='#f3d16a';ctx.lineWidth=2;for(let x=-46+off;x<W+46;x+=46){ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x+8,y+2);ctx.lineTo(x+16,y-8);ctx.stroke()}}ctx.fillStyle='#e8c35b';ctx.fillRect(0,PLAY,W,12);ctx.fillStyle='#568d3e';ctx.fillRect(0,PLAY+12,W,GROUND-12)}
  function drawBathroom(){const g=ctx.createLinearGradient(0,0,0,PLAY);g.addColorStop(0,'#def4ff');g.addColorStop(1,'#bfeae5');ctx.fillStyle=g;ctx.fillRect(0,0,W,PLAY);ctx.strokeStyle='#98b4b955';for(let x=-72-scroll*.18%72;x<W+72;x+=72){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,PLAY);ctx.stroke()}for(let y=48;y<PLAY;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=0,x=-scroll%112-112;x<W+112;x+=56,i++){ctx.fillStyle=i%2?'#eef5f7':'#0ea5e9';ctx.fillRect(x,PLAY,56,GROUND)}}
  function drawFork(cx,edge,top){ctx.save();ctx.translate(cx,edge);ctx.scale(1,top?-1:1);ctx.fillStyle='#b76a2a';ctx.strokeStyle='#633719';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-7,42,14,430,5);ctx.fill();ctx.stroke();ctx.fillStyle='#64748b';ctx.beginPath();ctx.roundRect(-29,29,58,13,6);ctx.fill();ctx.stroke();ctx.fillStyle='#e2e8f0';[-24,-8,8,24].forEach(x=>{ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+4,33);ctx.lineTo(x-4,33);ctx.closePath();ctx.fill();ctx.stroke()});ctx.restore()}
  function drawToilet(cx,edge,top){ctx.save();ctx.translate(cx,edge);ctx.scale(1,top?-1:1);ctx.lineJoin='round';ctx.lineWidth=2;const china=ctx.createLinearGradient(-24,0,24,0);china.addColorStop(0,'#cbd5df');china.addColorStop(.3,'#fff');china.addColorStop(.75,'#f8fafc');china.addColorStop(1,'#bac7d3');ctx.fillStyle=china;ctx.strokeStyle='#718096';
    // Compact toilet silhouette: tank, flush button, open bowl and pedestal.
    ctx.beginPath();ctx.roundRect(-24,0,48,34,6);ctx.fill();ctx.stroke();ctx.fillStyle='#94a3b8';ctx.beginPath();ctx.arc(16,12,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=china;ctx.beginPath();ctx.moveTo(-20,31);ctx.quadraticCurveTo(-32,35,-30,46);ctx.quadraticCurveTo(-28,59,-10,62);ctx.lineTo(-7,81);ctx.quadraticCurveTo(0,87,10,81);ctx.lineTo(13,62);ctx.quadraticCurveTo(30,57,30,44);ctx.quadraticCurveTo(30,34,19,31);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,39,29,8,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#9bd8e2';ctx.beginPath();ctx.ellipse(0,39,19,4.5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=china;ctx.beginPath();ctx.roundRect(-23,80,46,10,5);ctx.fill();ctx.stroke();ctx.restore()}
  function drawBird(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(2,-20,7,0,Math.PI*2);ctx.arc(9,-18,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fef9c3';ctx.strokeStyle='#78350f';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,21,18,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(18,-4);ctx.lineTo(30,1);ctx.lineTo(18,6);ctx.fill();ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(11,-5,3,0,Math.PI*2);ctx.fill();ctx.restore()}
  function drawPoo(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);ctx.fillStyle='#78350f';ctx.strokeStyle='#2a1002';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-21,5,42,14,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.roundRect(-16,-6,32,13,6);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,-10,10,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-5,0,4,0,Math.PI*2);ctx.arc(6,0,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(-4,0,2,0,Math.PI*2);ctx.arc(7,0,2,0,Math.PI*2);ctx.fill();ctx.restore()}
  function endGame(){if(state!=='PLAYING')return;state='GAME_OVER';saveScore()}
  function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;time+=dt;if(state==='TITLE'){scroll+=90*dt;bird.y=213+Math.sin(time*3.2)*10}else if(state==='PLAYING'){const speed=225+Math.min(score*3,85);scroll+=speed*dt;bird.vy=Math.min(bird.vy+1480*dt,620);bird.y+=bird.vy*dt;bird.rot=bird.vy<0?-.4:Math.min(bird.vy/520*1.1,1.1);if(bird.y-bird.r<6){bird.y=21;bird.vy=0}spawn();for(const o of obstacles){o.x-=speed*dt;if(!o.passed&&o.x+o.w/2<bird.x){o.passed=true;score++}if(collides(o))endGame()}obstacles=obstacles.filter(o=>o.x+o.w>-60);if(bird.y+bird.r>=PLAY){bird.y=PLAY-bird.r;endGame()}}
    const dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==W*dpr){canvas.width=W*dpr;canvas.height=H*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);if(map==='barn')drawFarm();else drawBathroom();for(const o of obstacles){const cx=o.x+o.w/2,top=o.y-o.gap/2,bottom=o.y+o.gap/2;if(map==='barn'){drawFork(cx,top,true);drawFork(cx,bottom,false)}else{drawToilet(cx,top,true);drawToilet(cx,bottom,false)}}if(map==='barn')drawBird();else drawPoo();ctx.fillStyle='#0f172a99';ctx.beginPath();ctx.roundRect(W/2-38,18,76,52,16);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 38px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(score),W/2,44);if(state!=='PLAYING'){ctx.fillStyle='#0f172a99';ctx.beginPath();ctx.roundRect(W/2-225,H/2-31,450,62,16);ctx.fill();ctx.fillStyle='#fff';ctx.font='700 21px system-ui';ctx.fillText(state==='TITLE'?'Click or Press Space to Start':'Game Over — Click or Space to Retry',W/2,H/2)}requestAnimationFrame(loop)}
  renderScores();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
