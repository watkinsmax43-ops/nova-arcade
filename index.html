<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Arcade</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-logo">🕹️</span>
        <div>
          <h1>Nova Arcade</h1>
          <p class="tagline">Play in your browser</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <section class="games-grid" aria-label="Available games">
      <a class="game-card game-card-link" href="8ball.html?v=2">
        <div class="card-banner" style="background: linear-gradient(135deg, #166534, #0f766e)">
          <span aria-hidden="true">🎱</span>
          <span class="card-badge">2 Players / vs AI</span>
        </div>
        <div class="card-body">
          <h2 class="card-title">8 Ball</h2>
          <p class="card-desc">Rack up and play pool with a friend or challenge the AI.</p>
          <div class="card-footer">
            <div class="card-tags">
              <span class="tag">2 Player</span>
              <span class="tag">Vs AI</span>
            </div>
            <span class="play-pill">Play ▶</span>
          </div>
        </div>
      </a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Nova Arcade — Static HTML and CSS • Ready for GitHub Pages</p>
    </div>
  </footer>
</body>
</html>
