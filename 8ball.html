<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8 Ball — Nova Arcade</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="8ball.css?v=2" />
  <script defer src="js/8ball.js?v=2"></script>
</head>
<body>
  <div class="game-shell">
    <a class="arcade-back" href="index.html">← Nova Arcade</a>
      <!-- Top Miniclip-Style HUD -->
      <header class="hud-header">
        <div class="player-card active" id="p1-card">
          <div class="avatar">👤</div>
          <div class="p-info">
            <div class="p-name-row">
              <span id="p1-name">Player 1</span>
              <span class="group-badge" id="p1-group">Open</span>
            </div>
            <div class="ball-rack" id="p1-rack"></div>
          </div>
        </div>

        <div class="center-controls">
          <div class="btn-strip">
            <button class="pill-btn active" id="btn-ai">1P vs AI</button>
            <button class="pill-btn" id="btn-2p">2P Local</button>
            <select class="pill-btn" id="ai-level" title="AI Skill">
              <option value="easy">AI: Easy</option>
              <option value="medium" selected>AI: Med</option>
              <option value="hard">AI: Hard</option>
            </select>
            <select class="pill-btn" id="table-theme" title="Table Felt Theme">
              <option value="blue">Sydney Blue</option>
              <option value="green">London Green</option>
              <option value="purple">Vegas Purple</option>
            </select>
            <div class="spin-wrap">
              <button class="spin-btn" id="spin-btn" title="Cue Ball Spin (English)">
                <span class="spin-dot-mini" id="spin-dot-mini"></span>
              </button>
              <div class="spin-popover hidden" id="spin-popover">
                <div style="font-size:0.76rem;font-weight:800;color:#e2e8f0;">Cue Ball Spin</div>
                <div class="spin-pad" id="spin-pad">
                  <div class="spin-crosshair-h"></div>
                  <div class="spin-crosshair-v"></div>
                  <div class="spin-dot-big" id="spin-dot-big"></div>
                </div>
                <div style="font-size:0.7rem;color:#94a3b8;" id="spin-readout">Center Hit</div>
                <button class="pill-btn" id="spin-reset" style="width:100%;">Reset Spin</button>
              </div>
            </div>
            <button class="pill-btn active" id="btn-sound" title="Sound">🔊</button>
            <button class="pill-btn" id="btn-new">New Match</button>
          </div>
        </div>

        <div class="player-card right" id="p2-card">
          <div class="avatar" id="p2-avatar">🤖</div>
          <div class="p-info">
            <div class="p-name-row">
              <span class="group-badge" id="p2-group">Open</span>
              <span id="p2-name">AI (Med)</span>
            </div>
            <div class="ball-rack" id="p2-rack"></div>
          </div>
        </div>
      </header>

      <!-- Main Arena: Left Power Pull-Back Slider + Table -->
      <div class="arena-row">
        <div class="power-slider-box" id="power-slider" title="Drag down to pull cue & release to shoot">
          <span class="power-label">POWER</span>
          <div class="power-track" id="power-track">
            <div class="power-fill" id="power-fill"></div>
            <div class="mini-cue-pull" id="mini-cue-pull"></div>
          </div>
          <span class="power-pct" id="power-pct">0%</span>
        </div>

        <div class="table-stage">
          <div class="toast-banner" id="toast-banner">BREAK SHOT — AIM &amp; PULL POWER TO SHOOT</div>
          <canvas id="pool-canvas" width="900" height="485"></canvas>

          <div class="victory-overlay hidden" id="victory-overlay">
            <div class="victory-card">
              <h2 id="victory-title">🏆 You Win!</h2>
              <p id="victory-reason">Clean 8-ball finish!</p>
              <button class="play-again-btn" id="play-again-btn">Play Again</button>
            </div>
          </div>
        </div>
      </div>

      <footer class="footer-bar">
        <div class="legend-group">
          <div class="legend-item"><span class="swatch" style="background:#ffffff;"></span> Cue Aim</div>
          <div class="legend-item"><span class="swatch" style="background:#22d3ee;"></span> Target Ball Path</div>
          <div class="legend-item"><span class="swatch" style="background:#facc15;"></span> White Ball Path (Follow / Draw)</div>
        </div>
        <div>Aim with mouse • Pull Left Power Bar OR drag back on table to shoot • ← / → Fine Aim</div>
      </footer>
    </div>

</body>
</html>
