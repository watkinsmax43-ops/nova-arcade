<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BitLife — Nova Arcade</title><link rel="stylesheet" href="style.css">
<style>
body{margin:0;background:#07111f;color:#e8eef7;font-family:system-ui,sans-serif}.life-shell{width:min(1120px,94%);margin:auto;padding:24px 0}.back{color:#7dd3fc;text-decoration:none;font-weight:700}.life-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}.life-head h1{margin:0}.head-actions{display:flex;gap:8px}.new-btn,.action,.tab{border:1px solid #334155;border-radius:9px;background:#172033;color:#fff;padding:10px 12px;font-weight:700;cursor:pointer}.age-up{background:#15803d;border-color:#4ade80;font-size:16px;padding:12px 18px}.life-grid{display:grid;grid-template-columns:260px 1fr;gap:16px}.profile,.panel{border:1px solid #ffffff1c;border-radius:14px;background:#111827}.profile{padding:16px}.avatar{height:100px;border-radius:12px;display:grid;place-items:center;font-size:54px;background:linear-gradient(135deg,#0ea5e9,#8b5cf6)}.age{font-size:28px;font-weight:800;margin:12px 0 4px}.career{color:#94a3b8;font-size:13px;margin-top:3px}.stat{margin:9px 0}.stat-row{display:flex;justify-content:space-between;font-size:13px}.bar{height:7px;border-radius:99px;background:#293449;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#a855f7)}.money{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.money div{background:#0b1220;border-radius:8px;padding:8px;font-size:12px}.money strong{display:block;color:#86efac;font-size:14px;margin-top:3px}.panel{padding:16px;min-height:500px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:12px;border-bottom:1px solid #ffffff17}.tab{white-space:nowrap}.tab.active{background:#075985;border-color:#38bdf8}.section-title{margin:16px 0 5px;font-size:20px}.section-help,.muted{color:#94a3b8;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px}.action{font-size:13px}.action:disabled,.new-btn:disabled{opacity:.45;cursor:not-allowed}.card{background:#0b1220;border:1px solid #ffffff14;border-radius:10px;padding:12px;margin:8px 0}.card h3{margin:0 0 5px;font-size:15px}.card .muted{margin-bottom:8px}.timeline{height:230px;overflow:auto;margin-top:16px;border-top:1px solid #ffffff12}.log{padding:10px 12px;border-bottom:1px solid #ffffff10;font-size:13px}.log:first-child{color:#bae6fd}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#020617cc;padding:20px;z-index:5}.modal[hidden]{display:none}.modal-card{width:min(500px,100%);background:#172033;border:1px solid #ffffff24;border-radius:16px;padding:20px}.modal-card h2{margin-top:0}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid #334155;border-radius:9px;background:#0b1220;color:#fff;padding:10px 12px;font-weight:700;cursor:pointer}@media(max-width:760px){.life-grid{grid-template-columns:1fr}.life-head{align-items:flex-start}.head-actions{flex-direction:column}.timeline{height:190px}}
</style></head>
<body><main class="life-shell"><a class="back" href="index.html">← Nova Arcade</a>
<header class="life-head"><div><h1>BitLife</h1><div class="career" id="career"></div></div><div class="head-actions"><button class="new-btn age-up" id="ageUpNow" type="button">Age Up →</button><button class="new-btn" id="newLife" type="button">New Life</button></div></header>
<div class="life-grid"><aside class="profile"><div class="avatar" id="avatar">🙂</div><div class="age" id="age">Age 0</div><div id="person"></div>
<div class="stat"><div class="stat-row"><span>Health</span><b id="healthText"></b></div><div class="bar"><i id="healthBar"></i></div></div><div class="stat"><div class="stat-row"><span>Happiness</span><b id="happyText"></b></div><div class="bar"><i id="happyBar"></i></div></div><div class="stat"><div class="stat-row"><span>Smarts</span><b id="smartText"></b></div><div class="bar"><i id="smartBar"></i></div></div><div class="stat"><div class="stat-row"><span>Looks</span><b id="looksText"></b></div><div class="bar"><i id="looksBar"></i></div></div><div class="stat"><div class="stat-row"><span>Athleticism</span><b id="athleticText"></b></div><div class="bar"><i id="athleticBar"></i></div></div><div class="money"><div>Cash<strong id="cash"></strong></div><div>Heat<strong id="heat"></strong></div></div><div class="money"><div>Dirty cash<strong id="dirty"></strong></div><div>Fame<strong id="fame"></strong></div></div></aside>
<section class="panel"><nav class="tabs" id="tabs" aria-label="Life menus"></nav><section id="menuContent"></section><div class="timeline" id="timeline" aria-label="Life history"></div></section></div></main>
<div class="modal" id="modal" hidden><div class="modal-card"><h2 id="modalTitle"></h2><p class="muted" id="modalText"></p><div class="choices" id="choices"></div></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,Math.round(v)));
const names=['Marcus Vance','Elena Silva','Kofi Okafor','Yuki Takahashi','Mateo Reyes','Nadia Moreau','Devon Cross'],clubs=['LA Galaxy','Arsenal','Flamengo','Real Madrid','Inter Miami','Bayern Munich'],songs=['Midnight in the Trap','Paper Chaser','Velvet Coupe','From the Concrete','Crown Heavy'];
const crimes=[{id:'pick',name:'Pickpocket',age:14,odds:.72,pay:[180,950],heat:6,years:1},{id:'gta',name:'Grand Theft Auto',age:16,odds:.54,pay:[6500,24000],heat:16,years:4},{id:'crypto',name:'Crypto Coin Scam',age:18,odds:.58,pay:[35000,240000],heat:24,years:8},{id:'heist',name:'Armored Bank Heist',age:18,odds:.34,pay:[250000,1400000],heat:40,years:14}];
const menus=[['life','Life'],['education','Education'],['jobs','Jobs'],['activities','Activities'],['crime','Crime & Court'],['family','Family']];let p,active='life';
function create(){const name=pick(names);p={name,age:0,alive:true,health:rand(78,98),happiness:rand(70,95),smarts:rand(40,88),looks:rand(38,88),athleticism:rand(35,88),charisma:rand(38,85),fame:0,karma:65,heat:0,cash:500,dirtyCash:0,salary:0,education:{stage:'none',grades:75,studied:false},career:{track:'unemployed',title:'Infant'},rapper:{active:false,stageName:'Lil Mirage',clout:0,streams:0,labelCut:.1},footballer:{active:false,club:pick(clubs),skill:50,goals:0},adult:{active:false,subscribers:0,scenes:0},dealer:{active:false,tier:0},prison:{in:false,years:0},family:[{name:'Mother',age:rand(24,34),relationship:85,alive:true},{name:'Father',age:rand(25,36),relationship:80,alive:true}],trial:null,log:[`Age 0: ${name} was born.`]};render()}
function addLog(s){p.log.unshift(`Age ${p.age}: ${s}`)}function cash(n){return '$'+Math.round(n).toLocaleString()}function safe(s){const e=document.createElement('span');e.textContent=String(s);return e.innerHTML}
function modal(title,text,choices){$('modalTitle').textContent=title;$('modalText').textContent=text;$('choices').replaceChildren();choices.forEach(([label,fn])=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>{$('modal').hidden=true;fn();render()};$('choices').append(b)});$('modal').hidden=false}
function ageUp(){if(!p.alive)return;if(p.trial){active='crime';render();return}p.age++;p.education.studied=false;
 if(p.prison.in){p.prison.years--;p.happiness=clamp(p.happiness-5);if(p.prison.years<=0){p.prison.in=false;p.heat=clamp(p.heat-35);p.career={track:'unemployed',title:'Unemployed'};addLog('Released from prison.')}else addLog(`Served a year in prison; ${p.prison.years} years remain.`)}else{
 if(p.age===6)p.education.stage='Elementary school';if(p.age===12)p.education.stage='Middle school';if(p.age===14)p.education.stage='High school';if(p.age===18&&p.education.stage==='High school'){p.education.stage='Graduated';addLog(`Graduated high school with ${p.education.grades}% grades.`)}
 if(p.salary)p.cash+=Math.round(p.salary*.78);if(p.footballer.active){const goals=Math.round(p.footballer.skill/100*rand(8,26));p.footballer.goals+=goals;addLog(`Scored ${goals} goals for ${p.footballer.club}.`)}if(p.adult.active)p.cash+=p.adult.subscribers*12;if(p.dealer.active){p.dirtyCash+=rand(18000,60000);p.heat=clamp(p.heat+5)}}
 p.family.forEach(n=>{if(n.alive){n.age++;if(n.age>78&&Math.random()<.08){n.alive=false;p.happiness=clamp(p.happiness-12);addLog(`${n.name} passed away.`)}}});p.happiness=clamp(p.happiness+rand(-3,3));if(p.age>60)p.health=clamp(p.health-rand(1,4));
 if(p.age>=16&&!p.prison.in&&Math.random()<.25)modal('A new opportunity!',p.athleticism>70?'A football scout wants to meet you.':'A clip of you is getting attention.',p.athleticism>70?[['Try out',()=>startJob('footballer')],['Pass',()=>addLog('Declined the tryout.')]]:[['Start rapping',()=>startJob('rapper')],['Take $5,000 sponsor offer',()=>{p.cash+=5000;addLog('Accepted a sponsor payout.')}],['Ignore it',()=>addLog('Let the opportunity pass.')]]);
 if(p.health<=0||(p.age>88&&Math.random()<.25)){p.alive=false;$('modal').hidden=true;addLog(`Passed away at age ${p.age}. Final cash: ${cash(p.cash)}.`)}render()}
function study(){if(p.prison.in||p.education.studied||['none','Graduated'].includes(p.education.stage))return;p.education.studied=true;p.education.grades=clamp(p.education.grades+rand(7,13));p.smarts=clamp(p.smarts+rand(2,5));addLog(`Studied harder. Grades ${p.education.grades}%, Smarts ${p.smarts}.`);render()}
function startJob(type){if(p.prison.in)return;if(type==='rapper'){p.rapper.active=true;p.career={track:type,title:'SoundCloud Rapper'};p.salary=6000;addLog(`Started a music career as ${p.rapper.stageName}.`)}if(type==='footballer'){p.footballer.active=true;p.footballer.skill=Math.max(p.footballer.skill,p.athleticism);p.career={track:type,title:`Pro Footballer — ${p.footballer.club}`};p.salary=p.athleticism>=75?92000:18000;addLog(`Signed with ${p.footballer.club}.`)}if(type==='adult'&&p.age>=18){p.adult.active=true;p.adult.subscribers=150;p.career={track:type,title:'Adult Content Creator'};p.salary=34000;addLog('Started an adult content creator career.')}if(type==='dealer'&&p.age>=16){p.dealer.active=true;p.career={track:type,title:'Street Dealer'};p.heat=clamp(p.heat+12);addLog('Started a risky fictional dealing career.')}render()}
function doActivity(action){if(p.prison.in)return;if(action==='single'&&p.rapper.active){const streams=rand(40000,300000)+(p.charisma+p.fame)*rand(500,2200),pay=Math.round(streams*.004*(1-p.rapper.labelCut));p.rapper.streams+=streams;p.rapper.clout=clamp(p.rapper.clout+rand(6,12));p.fame=clamp(p.fame+rand(4,8));p.cash+=pay;addLog(`Released “${pick(songs)}” — ${streams.toLocaleString()} streams and ${cash(pay)}.`)}if(action==='train'&&p.footballer.active){p.athleticism=clamp(p.athleticism+3);p.footballer.skill=clamp(p.footballer.skill+rand(2,4));addLog(`Trained. Football skill ${p.footballer.skill}/100.`)}if(action==='scene'&&p.adult.active){const pay=rand(5000,18000);p.cash+=pay;p.adult.scenes++;p.adult.subscribers+=rand(150,900);p.fame=clamp(p.fame+4);addLog(`Published a creator project and earned ${cash(pay)}.`)}if(action==='push'&&p.dealer.active){if(Math.random()<p.heat*.004){p.trial={crime:'Narcotics Trafficking',years:6};addLog('Arrested in a narcotics sting. Resolve the case in Crime & Court.')}else{const take=rand(10000,45000);p.dirtyCash+=take;p.heat=clamp(p.heat+rand(6,12));addLog(`Made ${cash(take)} in fictional dirty cash.`)}}if(action==='launder'&&p.dirtyCash>0){const clean=Math.round(p.dirtyCash*.65);p.cash+=clean;p.dirtyCash=0;p.heat=clamp(p.heat-8);addLog(`Converted dirty cash to ${cash(clean)}.`)}render()}
function attemptCrime(c){if(p.age<c.age||p.prison.in||p.trial)return;const odds=Math.max(.12,Math.min(.92,c.odds+(p.smarts-50)*.002-p.heat*.003));p.heat=clamp(p.heat+c.heat);if(Math.random()<odds){const take=rand(c.pay[0],c.pay[1]);p.cash+=take;p.karma-=12;addLog(`Got away with ${c.name} and ${cash(take)}.`)}else{p.trial={crime:c.name,years:c.years};addLog(`Arrested for ${c.name}; choose a court option.`)}render()}
function resolveTrial(lawyer){const t=p.trial;if(!t)return;if(lawyer&&p.cash>=35000)p.cash-=35000;else lawyer=false;p.trial=null;if(Math.random()<(lawyer?.65:.25))addLog(`Found not guilty of ${t.crime}.`);else{p.prison.in=true;p.prison.years=t.years;p.career={track:'unemployed',title:'In Prison'};p.salary=0;addLog(`Sentenced to ${t.years} years for ${t.crime}.`)}render()}
function card(title,description,buttons=[]){const box=document.createElement('article');box.className='card';const h=document.createElement('h3');h.textContent=title;box.append(h);const d=document.createElement('div');d.className='muted';d.textContent=description;box.append(d);if(buttons.length){const row=document.createElement('div');row.className='actions';buttons.forEach(([label,fn,disabled=false])=>{const b=document.createElement('button');b.className='action';b.textContent=label;b.disabled=disabled;b.onclick=fn;row.append(b)});box.append(row)}$('menuContent').append(box)}
function drawMenu(){const host=$('menuContent');host.replaceChildren();let title='',help='';if(active==='life'){title='Life';help='Use the green Age Up button above to advance one year.';card('Next year',p.alive?(p.prison.in?`${p.prison.years} years left in prison.`:'Ready to see what happens next?'):'This life has ended.',[['Age Up →',ageUp,!p.alive]])}
if(active==='education'){title='Education';help='School unlocks as your character grows.';card('School',`${p.education.stage==='none'?'Not enrolled':p.education.stage} · Grades ${p.education.grades}%${p.education.studied?' · Studied this year':''}`,[['Study harder',study,p.prison.in||p.education.studied||['none','Graduated'].includes(p.education.stage)]])}
if(active==='jobs'){title='Jobs & Careers';help='Choose an available path. Career actions appear under Activities.';card('Current job',`${p.career.title}${p.salary?` · Annual salary ${cash(p.salary)}`:''}`);card('Music career','Release songs, build clout and earn streaming income.',[['Become a rapper',()=>startJob('rapper'),p.age<16||p.prison.in||p.rapper.active]]);card('Football career',`Try to join ${p.footballer.club}. Athleticism affects your salary.`,[['Become a footballer',()=>startJob('footballer'),p.age<16||p.prison.in||p.footballer.active]]);card('Creator career','Fictional adult-only option.',[['Become a creator',()=>startJob('adult'),p.age<18||p.prison.in||p.adult.active]]);card('High-risk path','Fictional dealing career; heat can lead to arrest.',[['Become a dealer',()=>startJob('dealer'),p.age<16||p.prison.in||p.dealer.active]])}
if(active==='activities'){title='Activities';help='Actions for your current job and finances.';const buttons=[];if(p.rapper.active)buttons.push(['Drop a single',()=>doActivity('single')]);if(p.footballer.active)buttons.push(['Train',()=>doActivity('train')]);if(p.adult.active)buttons.push(['Publish creator project',()=>doActivity('scene')]);if(p.dealer.active)buttons.push(['Move product',()=>doActivity('push')]);if(p.dirtyCash>0)buttons.push(['Launder dirty cash',()=>doActivity('launder')]);if(buttons.length)card('Available activities','Choose an activity.',buttons);else card('No activities yet','Choose a job in the Jobs menu to unlock actions.');if(p.rapper.active)card('Music stats',`${p.rapper.streams.toLocaleString()} streams · ${p.rapper.clout} clout · ${p.fame} fame`);if(p.footballer.active)card('Football stats',`${p.footballer.club} · Skill ${p.footballer.skill}/100 · ${p.footballer.goals} goals`);if(p.adult.active)card('Creator stats',`${p.adult.subscribers} subscribers · ${p.adult.scenes} projects`)}
if(active==='crime'){title='Crime & Court';help='Fictional choices with random outcomes and consequences.';if(p.trial)card('Pending case',`${p.trial.crime} · Possible sentence ${p.trial.years} years.`,[['Go to trial',()=>resolveTrial(false)],['Hire lawyer ($35,000)',()=>resolveTrial(true),p.cash<35000]]);else if(p.prison.in)card('In prison',`${p.prison.years} years remain. Use Age Up to serve your sentence.`);crimes.forEach(c=>card(c.name,`Unlocks at age ${c.age} · Current heat ${p.heat}%.`,[['Attempt',()=>attemptCrime(c),p.age<c.age||p.prison.in||!!p.trial]]))}
if(active==='family'){title='Family';help='Your family members age as your life progresses.';p.family.forEach(n=>card(n.name,`Age ${n.age} · Relationship ${n.relationship}/100 · ${n.alive?'Alive':'Deceased'}`))}
const h=document.createElement('h2');h.className='section-title';h.textContent=title;const sub=document.createElement('p');sub.className='section-help';sub.textContent=help;host.prepend(sub);host.prepend(h)}
function render(){if(!p)return;$('age').textContent=`Age ${p.age}`;$('person').textContent=p.alive?p.name:'Deceased';$('career').textContent=p.career.title;$('avatar').textContent=p.alive?(p.prison.in?'🔒':'🙂'):'🕊️';[['health',p.health],['happy',p.happiness],['smart',p.smarts],['looks',p.looks],['athletic',p.athleticism]].forEach(([id,v])=>{$(id+'Text').textContent=v;$(id+'Bar').style.width=v+'%'});$('cash').textContent=cash(p.cash);$('heat').textContent=p.heat+'%';$('dirty').textContent=cash(p.dirtyCash);$('fame').textContent=p.fame;$('ageUpNow').disabled=!p.alive;$('tabs').replaceChildren();menus.forEach(([id,label])=>{const b=document.createElement('button');b.className='tab'+(active===id?' active':'');b.textContent=label;b.onclick=()=>{active=id;render()};$('tabs').append(b)});drawMenu();$('timeline').innerHTML=p.log.map(x=>`<div class="log">${safe(x)}</div>`).join('')}
$('ageUpNow').addEventListener('click',ageUp);$('newLife').addEventListener('click',create);create();
})();
</script></body></html>
