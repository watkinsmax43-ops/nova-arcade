<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BitLife — Nova Arcade</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{margin:0;background:#07111f;color:#e8eef7}.life-shell{width:min(1120px,94%);margin:auto;padding:24px 0}.back{color:#7dd3fc;text-decoration:none;font-weight:700}.life-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0}.life-head h1{margin:0}.new-btn,.action,.tab{border:1px solid #334155;border-radius:9px;background:#172033;color:#fff;padding:10px 12px;font-weight:700;cursor:pointer}.new-btn:hover,.action:hover,.tab:hover{border-color:#38bdf8}.life-grid{display:grid;grid-template-columns:260px 1fr;gap:16px}.profile,.panel{border:1px solid #ffffff1c;border-radius:14px;background:#111827}.profile{padding:16px}.avatar{height:110px;border-radius:12px;display:grid;place-items:center;font-size:58px;background:linear-gradient(135deg,#0ea5e9,#8b5cf6)}.age{font-size:28px;font-weight:800;margin:12px 0 4px}.career{color:#94a3b8;font-size:13px;margin-top:3px}.stat{margin:9px 0}.stat-row{display:flex;justify-content:space-between;font-size:13px}.bar{height:7px;border-radius:99px;background:#293449;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#a855f7)}.money{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.money div{background:#0b1220;border-radius:8px;padding:8px;font-size:12px}.money strong{display:block;color:#86efac;font-size:14px;margin-top:3px}.panel{padding:16px;min-height:510px}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;border-bottom:1px solid #ffffff17}.tab{white-space:nowrap;padding:9px 12px}.tab.active{background:#075985;border-color:#38bdf8}.section-title{margin:16px 0 5px;font-size:20px}.section-help{color:#94a3b8;font-size:13px;margin:0 0 14px}.actions{display:flex;flex-wrap:wrap;gap:8px}.action{font-size:13px}.action:disabled{opacity:.42;cursor:not-allowed}.card{background:#0b1220;border:1px solid #ffffff14;border-radius:10px;padding:12px;margin:8px 0}.card h3{margin:0 0 5px;font-size:15px}.muted{color:#94a3b8;font-size:13px}.timeline{height:260px;overflow:auto;margin-top:16px;border-top:1px solid #ffffff12}.log{padding:10px 12px;border-bottom:1px solid #ffffff10;font-size:13px}.log:first-child{color:#bae6fd}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#020617cc;padding:20px;z-index:5}.modal[hidden]{display:none}.modal-card{width:min(520px,100%);background:#172033;border:1px solid #ffffff24;border-radius:16px;padding:20px}.modal-card h2{margin-top:0}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid #334155;border-radius:9px;background:#0b1220;color:#fff;padding:10px 12px;font-weight:700;cursor:pointer}.choice:hover{border-color:#38bdf8}.family-row{display:flex;justify-content:space-between;gap:10px}.danger{color:#fca5a5}@media(max-width:760px){.life-grid{grid-template-columns:1fr}.timeline{height:220px}.life-head{align-items:flex-start}}
  </style>
</head>
<body>
<main class="life-shell">
  <a class="back" href="index.html">← Nova Arcade</a>
  <div class="life-head"><div><h1>BitLife</h1><div class="career" id="career"></div></div><button class="new-btn" id="newLife">New Life</button></div>
  <div class="life-grid">
    <aside class="profile">
      <div class="avatar" id="avatar">🙂</div><div class="age" id="age">Age 0</div><div id="person"></div>
      <div class="stat"><div class="stat-row"><span>Health</span><b id="healthText"></b></div><div class="bar"><i id="healthBar"></i></div></div>
      <div class="stat"><div class="stat-row"><span>Happiness</span><b id="happyText"></b></div><div class="bar"><i id="happyBar"></i></div></div>
      <div class="stat"><div class="stat-row"><span>Smarts</span><b id="smartText"></b></div><div class="bar"><i id="smartBar"></i></div></div>
      <div class="stat"><div class="stat-row"><span>Looks</span><b id="looksText"></b></div><div class="bar"><i id="looksBar"></i></div></div>
      <div class="stat"><div class="stat-row"><span>Athleticism</span><b id="athleticText"></b></div><div class="bar"><i id="athleticBar"></i></div></div>
      <div class="money"><div>Cash<strong id="cash"></strong></div><div>Heat<strong id="heat"></strong></div></div>
      <div class="money"><div>Dirty cash<strong id="dirty"></strong></div><div>Fame<strong id="fame"></strong></div></div>
    </aside>
    <section class="panel">
      <nav class="tabs" id="tabs" aria-label="Life menus"></nav>
      <section id="menuContent"></section>
      <div class="timeline" id="timeline" aria-label="Life history"></div>
    </section>
  </div>
</main>
<div class="modal" id="modal" hidden><div class="modal-card"><h2 id="modalTitle"></h2><p class="muted" id="modalText"></p><div class="choices" id="choices"></div></div></div>
<script>
(()=>{
  const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,Math.round(v)));
  const names=['Marcus Vance','Elena Silva','Kofi Okafor','Yuki Takahashi','Mateo Reyes','Nadia Moreau','Devon Cross'];
  const clubs=['LA Galaxy','Arsenal','Flamengo','Real Madrid','Inter Miami','Bayern Munich'];
  const songs=['Midnight in the Trap','Paper Chaser','Velvet Coupe','From the Concrete','Crown Heavy'];
  const crimes=[{id:'pickpocket',name:'Pickpocket',age:14,odds:.72,pay:[180,950],heat:6,years:1},{id:'gta',name:'Grand Theft Auto',age:16,odds:.54,pay:[6500,24000],heat:16,years:4},{id:'crypto',name:'Rug-Pull Crypto Coin',age:18,odds:.58,pay:[35000,240000],heat:24,years:8},{id:'heist',name:'Armored Bank Heist',age:18,odds:.34,pay:[250000,1400000],heat:40,years:14}];
  const menus=[['life','Life'],['education','Education'],['jobs','Jobs'],['activities','Activities'],['crime','Crime & Court'],['family','Family']];
  let p,activeMenu='life';
  function create(){const name=pick(names);p={name,country:'United States',age:0,alive:true,health:rand(78,98),happiness:rand(70,95),smarts:rand(40,88),looks:rand(38,88),athleticism:rand(35,88),charisma:rand(38,85),fame:0,karma:65,heat:0,cash:500,dirtyCash:0,salary:0,education:{stage:'none',grades:75,studied:false,degrees:[]},career:{track:'unemployed',title:'Infant'},rapper:{active:false,stageName:'Lil Mirage',clout:0,streams:0,tier:0,labelCut:.1},footballer:{active:false,club:pick(clubs),skill:50,goals:0,trophies:0,tier:0},adult:{active:false,alias:name.split(' ')[0]+' Blaze',subscribers:0,scenes:0,awards:0},drug:{active:false,territory:10,enforcers:0,tier:0},prison:{inPrison:false,yearsLeft:0,respect:20},npcs:[{name:'Mother',role:'Mother',age:rand(24,34),relationship:85,alive:true},{name:'Father',role:'Father',age:rand(25,36),relationship:80,alive:true}],pendingTrial:null,pendingEvent:null,log:[`Age 0: Born in the ${name} family in ${'United States'}.`]};render()}
  function addLog(message){p.log.unshift(`Age ${p.age}: ${message}`)}
  function money(n){return '$'+Math.round(n).toLocaleString()}
  function escapeText(value){const el=document.createElement('span');el.textContent=String(value);return el.innerHTML}
  function showModal(title,text,choices){$('modalTitle').textContent=title;$('modalText').textContent=text||'';$('choices').replaceChildren();choices.forEach(([label,action])=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>{$('modal').hidden=true;action();render()};$('choices').append(b)});$('modal').hidden=false}
  function startCareer(type){if(p.prison.inPrison)return;if(type==='rapper'){p.rapper.active=true;p.career={track:type,title:'SoundCloud Rapper'};p.salary=6000;addLog(`Started a music career as ${p.rapper.stageName}.`)}else if(type==='footballer'){p.footballer.active=true;p.footballer.skill=Math.max(p.footballer.skill,p.athleticism);p.career={track:type,title:`Pro Footballer (${p.footballer.club})`};p.salary=p.athleticism>=75?92000:18000;addLog(`Signed with ${p.footballer.club}.`)}else if(type==='adult'&&p.age>=18){p.adult.active=true;p.adult.subscribers=150;p.career={track:type,title:'Adult Content Creator'};p.salary=34000;addLog(`Started an adult content creator career as ${p.adult.alias}.`)}else if(type==='drug'&&p.age>=16){p.drug.active=true;p.career={track:type,title:'Corner Runner'};p.heat=clamp(p.heat+12);addLog('Started dealing. Heat is shown on your profile.') }render()}
  function study(){if(p.prison.inPrison||p.education.studied||['none','finished'].includes(p.education.stage))return;p.education.studied=true;p.education.grades=clamp(p.education.grades+rand(7,13));p.smarts=clamp(p.smarts+rand(2,5));addLog(`Studied harder. Grades: ${p.education.grades}%, Smarts: ${p.smarts}.`);render()}
  function work(action){if(p.prison.inPrison)return;if(p.rapper.active&&action==='single'){const streams=rand(40000,300000)+(p.charisma+p.fame)*rand(500,2200),pay=Math.round(streams*.004*(1-p.rapper.labelCut));p.rapper.streams+=streams;p.rapper.clout=clamp(p.rapper.clout+rand(6,12));p.fame=clamp(p.fame+rand(4,8));p.cash+=pay;addLog(`Released “${pick(songs)}” — ${streams.toLocaleString()} streams and ${money(pay)}.`)}else if(p.footballer.active&&action==='train'){p.athleticism=clamp(p.athleticism+3);p.footballer.skill=clamp(p.footballer.skill+rand(2,4));addLog(`Trained. Football skill is now ${p.footballer.skill}/100.`)}else if(p.adult.active&&action==='film'){const pay=rand(5000,18000),subs=rand(150,900);p.cash+=pay;p.adult.scenes++;p.adult.subscribers+=subs;p.fame=clamp(p.fame+4);addLog(`Filmed a creator scene: ${money(pay)} and ${subs} new subscribers.`)}else if(p.drug.active&&action==='push'){if(Math.random()<(p.heat*.4)/100){p.pendingTrial={crime:'Narcotics Trafficking',sentence:6,evidence:75};addLog('Arrested in a narcotics sting. A court decision is available in Crime & Court.')}else{const take=rand(10000,45000)*(p.drug.tier+1);p.dirtyCash+=take;p.heat=clamp(p.heat+rand(6,12));addLog(`Made ${money(take)} in dirty cash.`)}}else if(p.drug.active&&action==='launder'&&p.dirtyCash>0){const clean=Math.round(p.dirtyCash*(p.career.track==='drug'?.65:.65));p.cash+=clean;p.dirtyCash=0;p.heat=clamp(p.heat-8);addLog(`Converted dirty cash to ${money(clean)} clean cash.`)}render()}
  function commitCrime(id){const c=crimes.find(x=>x.id===id);if(!c||p.age<c.age||p.prison.inPrison||p.pendingTrial)return;const odds=Math.max(.12,Math.min(.92,c.odds+(p.smarts-50)*.002-p.heat*.003));p.heat=clamp(p.heat+c.heat);if(Math.random()<odds){const take=rand(c.pay[0],c.pay[1]);p.cash+=take;p.karma=clamp(p.karma-12);addLog(`Got away with ${c.name} and ${money(take)}.`)}else{p.pendingTrial={crime:c.name,sentence:c.years,evidence:rand(55,90)};addLog(`Arrested for ${c.name}. Resolve the case in Crime & Court.`)}render()}
  function resolveTrial(lawyer=false){const t=p.pendingTrial;if(!t)return;if(lawyer&&p.cash>=35000)p.cash-=35000;else lawyer=false;p.pendingTrial=null;if(Math.random()<(lawyer?.65:.25)){addLog(`Found not guilty of ${t.crime}.`)}else{p.prison.inPrison=true;p.prison.yearsLeft=t.sentence;p.career={track:'unemployed',title:'In Prison'};p.salary=0;addLog(`Sentenced to ${t.sentence} years for ${t.crime}.`)}render()}
  function ageUp(){if(!p.alive||p.pendingEvent||p.pendingTrial)return;p.age++;p.education.studied=false;
    if(p.prison.inPrison){p.prison.yearsLeft--;p.happiness=clamp(p.happiness-5);if(p.prison.yearsLeft<=0){p.prison.inPrison=false;p.heat=clamp(p.heat-35);p.career={track:'unemployed',title:'Unemployed'};addLog('Released from prison.')}else addLog(`Year in prison; ${p.prison.yearsLeft} years remain.`)}else{
      if(p.age===6)p.education.stage='elementary school';if(p.age===12)p.education.stage='middle school';if(p.age===14)p.education.stage='high school';if(p.age===18&&p.education.stage==='high school'){p.education.stage='finished';addLog(`Graduated high school with ${p.education.grades}% grades.`)}
      if(p.salary>0)p.cash+=Math.round(p.salary*.78);if(p.footballer.active){const goals=Math.round(p.footballer.skill/100*rand(8,26));p.footballer.goals+=goals;addLog(`Scored ${goals} goals for ${p.footballer.club}.`)}if(p.adult.active)p.cash+=p.adult.subscribers*12;if(p.drug.active){p.dirtyCash+=rand(18000,60000)*(p.drug.tier+1);p.heat=clamp(p.heat+5)}
    }
    p.npcs.forEach(n=>{if(!n.alive)return;n.age++;if(n.age>78&&Math.random()<.12){n.alive=false;p.happiness=clamp(p.happiness-15);addLog(`${n.name} passed away at age ${n.age}.`)}});
    p.happiness=clamp(p.happiness+rand(-3,3));if(p.age>60)p.health=clamp(p.health-rand(1,4));
    if(p.age>=16&&!p.prison.inPrison&&Math.random()<.35){p.pendingEvent=true;if(p.athleticism>=70)showModal('A pro scout is watching!','A scout offers you a chance to try out.',[['Sign with '+p.footballer.club,()=>{p.pendingEvent=false;startCareer('footballer')}],['Pass',()=>{p.pendingEvent=false;addLog('Declined the football tryout.')}]]);else showModal('A video of you goes viral!','Choose how to use your sudden attention.',[['Start a rap career',()=>{p.pendingEvent=false;startCareer('rapper')}],['Take $5,000 sponsor cash',()=>{p.pendingEvent=false;p.cash+=5000;addLog('Accepted a $5,000 sponsor payout.')}],['Ignore it',()=>{p.pendingEvent=false;addLog('Let the viral moment pass.')}]]);}
    if(p.health<=0||(p.age>88&&Math.random()<.25)){p.alive=false;p.pendingEvent=false;$('modal').hidden=true;addLog(`Passed away at age ${p.age}. Final cash: ${money(p.cash)}.`)}render()
  }
  function card(title,description,buttons=[]){const box=document.createElement('article');box.className='card';const h=document.createElement('h3');h.textContent=title;box.append(h);const d=document.createElement('div');d.className='muted';d.textContent=description;box.append(d);if(buttons.length){const row=document.createElement('div');row.className='actions';row.style.marginTop='10px';buttons.forEach(([label,fn,disabled=false])=>{const b=document.createElement('button');b.className='action';b.textContent=label;b.disabled=disabled;b.onclick=fn;row.append(b)});box.append(row)}$('menuContent').append(box)}
  function renderMenu(){const host=$('menuContent');host.replaceChildren();let title='',help='';if(activeMenu==='life'){title='Life';help='Advance time one year at a time and see how your story unfolds.';card('Your year',p.alive?(p.prison.inPrison?`${p.prison.yearsLeft} years left in prison.`:'Ready to see what happens next?'):'This life has ended.',[['Age Up',ageUp,!p.alive||p.pendingTrial||p.pendingEvent]])}
    if(activeMenu==='education'){title='Education';help='School progression and studying.';card('School',`${p.education.stage==='none'?'Not enrolled yet':p.education.stage} · Grades ${p.education.grades}%${p.education.studied?' · Studied this year':''}`,[['Study Harder',study,p.prison.inPrison||p.education.studied||['none','finished'].includes(p.education.stage)]])}
    if(activeMenu==='jobs'){title='Jobs & Careers';help='Choose a career when eligible, then use Activities to work at it.';card('Current career',`${p.career.title}${p.salary?` · Annual salary ${money(p.salary)}`:''}`);if(p.career.track==='unemployed'){card('Music',p.age>=16?'Launch a music career.':'Available from age 16.',[['Become a rapper',()=>startCareer('rapper'),p.age<16||p.prison.inPrison]]);card('Professional football',`Try to join ${p.footballer.club}. Your athleticism affects your contract.`,[['Become a footballer',()=>startCareer('footballer'),p.age<16||p.prison.inPrison]]);card('Adult content creator','A fictional adult-only career option.',[['Become a creator',()=>startCareer('adult'),p.age<18||p.prison.inPrison]]);card('Drug dealing','A risky fictional career. Heat can lead to arrest.',[['Become a dealer',()=>startCareer('drug'),p.age<16||p.prison.inPrison]])}else card('Career active',`You are working as ${p.career.title}.`)}
    if(activeMenu==='activities'){title='Activities';help='Career-specific actions and ways to use your skills.';const buttons=[];if(p.rapper.active)buttons.push(['Drop a single',()=>work('single')]);if(p.footballer.active)buttons.push(['Train',()=>work('train')]);if(p.adult.active)buttons.push(['Film a creator scene',()=>work('film')]);if(p.drug.active){buttons.push(['Move product',()=>work('push')],['Launder dirty cash',()=>work('launder'),p.dirtyCash<=0])}if(!buttons.length)card('No career activities yet','Choose a career from Jobs to unlock activities.');else card('Available actions','Choose an action to build your career.',buttons);if(p.rapper.active)card('Music stats',`${p.rapper.streams.toLocaleString()} streams · ${p.rapper.clout} clout · ${p.fame} fame`);if(p.footballer.active)card('Football stats',`${p.footballer.club} · Skill ${p.footballer.skill}/100 · ${p.footballer.goals} career goals`);if(p.adult.active)card('Creator stats',`${p.adult.subscribers.toLocaleString()} subscribers · ${p.adult.scenes} scenes`);if(p.drug.active)card('Territory',`${p.drug.territory}% · Heat ${p.heat}% · Dirty cash ${money(p.dirtyCash)}`)}
    if(activeMenu==='crime'){title='Crime & Court';help='Fictional, turn-based choices. Crimes can fail and lead to a trial or prison.';if(p.pendingTrial){card('Pending case',`${p.pendingTrial.crime} · Possible sentence: ${p.pendingTrial.sentence} years.`,[['Go to trial',()=>resolveTrial(false)],['Hire elite lawyer ($35,000)',()=>resolveTrial(true),p.cash<35000]])}else if(p.prison.inPrison)card('In prison',`${p.prison.yearsLeft} years remain. Use Age Up to serve your sentence.`);else{crimes.forEach(c=>card(c.name,`Available at age ${c.age} · Higher Heat makes future trouble more likely.`,[[`Attempt ${c.name}`,()=>commitCrime(c.id),p.age<c.age]]));if(p.age<14)card('Unavailable','Crime choices unlock with age.') }if(p.heat>0)card('Heat',`Current heat: ${p.heat}%. A higher value increases risk.`)}
    if(activeMenu==='family'){title='Family & Relationships';help='Your family members age alongside you.';p.npcs.forEach(n=>card(n.role,`${n.name} · Age ${n.age} · Relationship ${n.relationship}/100 · ${n.alive?'Alive':'Deceased'}`))}
    const h=document.createElement('h2');h.className='section-title';h.textContent=title;const sub=document.createElement('p');sub.className='section-help';sub.textContent=help;host.prepend(sub);host.prepend(h)
  }
  function render(){if(!p)return;$('age').textContent=`Age ${p.age}`;$('person').textContent=p.alive?p.name:'Deceased';$('career').textContent=p.career.title;$('avatar').textContent=p.alive?(p.prison.inPrison?'🔒':'🙂'):'🕊️';[['health',p.health],['happy',p.happiness],['smart',p.smarts],['looks',p.looks],['athletic',p.athleticism]].forEach(([id,value])=>{$(id+'Text').textContent=value;$ (id+'Bar').style.width=value+'%'});$('cash').textContent=money(p.cash);$('heat').textContent=p.heat+'%';$('dirty').textContent=money(p.dirtyCash);$('fame').textContent=p.fame;
    $('tabs').replaceChildren();menus.forEach(([id,label])=>{const b=document.createElement('button');b.className='tab'+(activeMenu===id?' active':'');b.textContent=label;b.setAttribute('aria-current',activeMenu===id?'page':'false');b.onclick=()=>{activeMenu=id;render()};$('tabs').append(b)});renderMenu();$('timeline').innerHTML=p.log.map(entry=>`<div class="log">${escapeText(entry)}</div>`).join('')}
  $('newLife').onclick=create;create();
})();
</script>
</body>
</html>
