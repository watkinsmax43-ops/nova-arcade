<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BitLife — Nova Arcade</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{margin:0;background:#07111f;color:#e8eef7}.life-shell{width:min(1080px,94%);margin:auto;padding:24px 0}.back{color:#7dd3fc;text-decoration:none;font-weight:700}.life-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0}.life-head h1{margin:0}.new-btn,.action,.choice{border:1px solid #334155;border-radius:9px;background:#172033;color:#fff;padding:10px 12px;font-weight:700;cursor:pointer}.new-btn:hover,.action:hover,.choice:hover{border-color:#38bdf8}.life-grid{display:grid;grid-template-columns:260px 1fr;gap:16px}.profile,.panel{border:1px solid #ffffff1c;border-radius:14px;background:#111827}.profile{padding:16px}.avatar{height:120px;border-radius:12px;display:grid;place-items:center;font-size:58px;background:linear-gradient(135deg,#0ea5e9,#8b5cf6)}.age{font-size:28px;font-weight:800;margin:12px 0 4px}.stat{margin:9px 0}.stat-row{display:flex;justify-content:space-between;font-size:13px}.bar{height:7px;border-radius:99px;background:#293449;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#a855f7)}.money{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.money div{background:#0b1220;border-radius:8px;padding:8px;font-size:12px}.money strong{display:block;color:#86efac;font-size:14px;margin-top:3px}.panel{padding:16px}.actions{display:flex;flex-wrap:wrap;gap:8px}.action{font-size:13px}.timeline{height:430px;overflow:auto;margin-top:14px;border-top:1px solid #ffffff12}.log{padding:12px;border-bottom:1px solid #ffffff10;font-size:14px}.log:first-child{color:#bae6fd}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#020617cc;padding:20px}.modal[hidden]{display:none}.modal-card{width:min(520px,100%);background:#172033;border:1px solid #ffffff24;border-radius:16px;padding:20px}.modal-card h2{margin-top:0}.choices{display:flex;flex-wrap:wrap;gap:8px}.career{color:#94a3b8;font-size:13px;margin-top:3px}@media(max-width:760px){.life-grid{grid-template-columns:1fr}.timeline{height:300px}}
  </style>
</head>
<body>
<main class="life-shell">
  <a class="back" href="index.html">← Nova Arcade</a>
  <div class="life-head"><div><h1>BitLife</h1><div class="career" id="career"></div></div><button class="new-btn" id="newLife">New Life</button></div>
  <div class="life-grid">
    <aside class="profile">
      <div class="avatar">🙂</div><div class="age" id="age">Age 0</div><div id="person"></div>
      <div class="stat"><div class="stat-row"><span>Health</span><b id="healthText"></b></div><div class="bar"><i id="healthBar"></i></div></div>
      <div class="stat"><div class="stat-row"><span>Happiness</span><b id="happyText"></b></div><div class="bar"><i id="happyBar"></i></div></div>
      <div class="stat"><div class="stat-row"><span>Smarts</span><b id="smartText"></b></div><div class="bar"><i id="smartBar"></i></div></div>
      <div class="stat"><div class="stat-row"><span>Looks</span><b id="looksText"></b></div><div class="bar"><i id="looksBar"></i></div></div>
      <div class="money"><div>Cash<strong id="cash"></strong></div><div>Heat<strong id="heat"></strong></div></div>
    </aside>
    <section class="panel"><div class="actions" id="actions"></div><div class="timeline" id="timeline"></div></section>
  </div>
</main>
<div class="modal" id="modal" hidden><div class="modal-card"><h2 id="modalTitle"></h2><div class="choices" id="choices"></div></div></div>
<script>
const $=id=>document.getElementById(id);const pick=a=>a[Math.floor(Math.random()*a.length)];const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,Math.round(v)));
const names=['Marcus Vance','Elena Silva','Kofi Okafor','Yuki Takahashi','Mateo Reyes','Nadia Moreau','Devon Cross'];
const crimes=[{id:'pick',name:'Pickpocket',age:14,pay:[180,950],heat:6,years:1},{id:'gta',name:'Grand Theft Auto',age:16,pay:[6500,24000],heat:16,years:4},{id:'crypto',name:'Crypto Scam',age:18,pay:[35000,240000],heat:24,years:8},{id:'heist',name:'Armored Bank Heist',age:18,pay:[250000,1400000],heat:40,years:14}];
const songs=['Midnight in the Trap','Paper Chaser','Velvet Coupe','From the Concrete','Crown Heavy'];
let p;
function create(){const name=pick(names);p={name,country:'United States',age:0,alive:true,health:rand(78,98),happiness:rand(70,95),smarts:rand(40,88),looks:rand(38,88),athleticism:rand(35,88),charisma:rand(38,85),fame:0,karma:65,heat:0,cash:500,dirtyCash:0,salary:0,debt:0,education:{stage:'none',grades:75,studied:false},career:{track:'unemployed',title:'Infant'},rapper:{active:false,stageName:'Lil Mirage',clout:0,streams:0,tier:0,labelCut:.1},footballer:{active:false,club:'Arsenal',skill:50,goals:0,tier:0},adult:{active:false,alias:name.split(' ')[0]+' Blaze',subscribers:0,scenes:0},drug:{active:false,territory:10,tier:0},prison:{inJail:false,years:0},pendingTrial:null,log:[`Age 0: Born in the United States as ${name}.`]};render()}
function log(text){p.log.unshift(`Age ${p.age}: ${text}`);render()}
function money(n){return '$'+Math.round(n).toLocaleString()}
function ageUp(){if(!p.alive||p.prison.inJail||p.pendingTrial)return;if(p.age>=100){p.alive=false;log(`Passed away at age ${p.age}.`);return}p.age++;p.education.studied=false;
  if(p.age===6)p.education.stage='elementary';if(p.age===12)p.education.stage='middle';if(p.age===14)p.education.stage='high school';if(p.age===18&&p.education.stage==='high school'){p.education.stage='finished';log(`Graduated high school with ${p.education.grades}% grades.`)}
  if(p.prison.inJail){}else{if(p.salary)p.cash+=Math.round(p.salary*.78);if(p.rapper.active){p.rapper.streams+=rand(500,50000);p.rapper.clout=clamp(p.rapper.clout+rand(0,2));if(p.rapper.clout>35)p.rapper.tier=Math.max(p.rapper.tier,1)}if(p.footballer.active){const goals=Math.round(p.footballer.skill/100*rand(8,26));p.footballer.goals+=goals;log(`Scored ${goals} goals for ${p.footballer.club}.`)}if(p.adult.active)p.cash+=p.adult.subscribers*12;if(p.drug.active){p.dirtyCash+=rand(18000,60000)*(p.drug.tier+1);p.heat=clamp(p.heat+5)}}
  p.happiness=clamp(p.happiness+rand(-3,3));p.health=clamp(p.health+(p.age>60?-rand(1,3):rand(-1,1)));
  if(p.age>=16&&Math.random()<.32){const football=p.athleticism>=65;showModal(football?'Pro scout watching!':'Viral opportunity!',football?[['Sign tryout',()=>startCareer('footballer')],['Decline',()=>log('Declined the tryout.')]]:[['Start rapping',()=>startCareer('rapper')],['Take sponsor cash',()=>{p.cash+=5000;log('Accepted a $5,000 sponsor payout.')}]])}
  if(p.health<=0||(p.age>88&&Math.random()<.25)){p.alive=false;log(`Passed away at age ${p.age}. Final cash: ${money(p.cash)}.`)}render()}
function startCareer(type){if(p.age<16&&type==='drug')return;if(type==='rapper'){p.rapper.active=true;p.rapper.stageName=prompt('Choose your rap name:',p.rapper.stageName)||p.rapper.stageName;p.career={track:'rapper',title:'SoundCloud Rapper'};p.salary=6000;log(`Launched a rap career as ${p.rapper.stageName}.`)}if(type==='footballer'){p.footballer.active=true;p.footballer.skill=Math.max(p.footballer.skill,p.athleticism);p.career={track:'footballer',title:`Pro Footballer (${p.footballer.club})`};p.salary=p.athleticism>=75?92000:18000;log(`Signed with ${p.footballer.club}.`)}if(type==='adult'&&p.age>=18){p.adult.active=true;p.career={track:'adult',title:'Adult Content Creator'};p.adult.subscribers=150;p.salary=34000;log('Entered the adult content industry.')}if(type==='drug'&&p.age>=16){p.drug.active=true;p.career={track:'drug',title:'Corner Runner'};p.heat=clamp(p.heat+12);log('Hit the block selling product.')}render()}
function study(){if(p.prison.inJail||p.education.stage==='none'||p.education.stage==='finished'||p.education.studied)return;p.education.studied=true;p.education.grades=clamp(p.education.grades+rand(7,13));p.smarts=clamp(p.smarts+rand(2,5));log(`Studied harder. Grades: ${p.education.grades}%, Smarts: ${p.smarts}.`)}
function crime(id){const c=crimes.find(x=>x.id===id);if(!c||p.age<c.age||p.prison.inJail)return;p.heat=clamp(p.heat+c.heat);const odds=Math.max(.12,Math.min(.92,.48+(p.smarts-50)*.002-p.heat*.003));if(Math.random()<odds){const take=rand(c.pay[0],c.pay[1]);p.cash+=take;p.karma=clamp(p.karma-12);log(`Pulled off ${c.name} for ${money(take)}!`)}else{p.pendingTrial=c;log(`Arrested for ${c.name}. Awaiting trial.`)}render()}
function trial(elite){const c=p.pendingTrial;if(!c)return;if(elite&&p.cash>=35000)p.cash-=35000;else elite=false;if(Math.random<(elite?.65:.25)){log(`Found NOT GUILTY for ${c.name}.`)}else{p.prison.inJail=true;p.prison.years=c.years;p.career={track:'unemployed',title:'Prisoner'};p.salary=0;log(`Sentenced to ${c.years} years for ${c.name}.`)}p.pendingTrial=null;render()}
function special(action){if(p.rapper.active&&action==='drop'){const streams=rand(40000,300000)+(p.charisma+p.fame)*rand(500,2200),pay=Math.round(streams*.004*(1-p.rapper.labelCut));p.rapper.streams+=streams;p.rapper.clout=clamp(p.rapper.clout+rand(6,12));p.fame=clamp(p.fame+rand(4,8));p.cash+=pay;log(`Dropped "${pick(songs)}" — ${streams.toLocaleString()} streams (${money(pay)}).`)}if(p.footballer.active&&action==='train'){p.athleticism=clamp(p.athleticism+3);p.footballer.skill=clamp(p.footballer.skill+rand(2,4));log(`Trained hard. Football skill: ${p.footballer.skill}.`)}if(p.adult.active&&action==='scene'){const pay=rand(5000,18000),subs=rand(150,900);p.cash+=pay;p.adult.subscribers+=subs;p.adult.scenes++;p.fame=clamp(p.fame+4);log(`Filmed a scene (${money(pay)}, +${subs} subscribers).`)}if(p.drug.active&&action==='push'){if(Math.random()<p.heat*.004){p.pendingTrial={name:'Narcotics Trafficking',years:6};log('Busted in an undercover narcotics sting!')}else{const take=rand(10000,45000)*(p.drug.tier+1);p.dirtyCash+=take;p.heat=clamp(p.heat+rand(6,12));log(`Moved a shipment for ${money(take)} dirty cash.`)}}if(p.drug.active&&action==='launder'&&p.dirtyCash){const clean=Math.round(p.dirtyCash*.88);p.cash+=clean;p.dirtyCash=0;p.heat=clamp(p.heat-8);log(`Laundered dirty cash into ${money(clean)} clean money.`)}render()}
function showModal(title,choices){$('modalTitle').textContent=title;$('choices').innerHTML='';choices.forEach(([text,fn])=>{const b=document.createElement('button');b.className='choice';b.textContent=text;b.onclick=()=>{$('modal').hidden=true;fn();render()};$('choices').appendChild(b)});$('modal').hidden=false}
function render(){if(!p)return;$('age').textContent=`Age ${p.age}`;$('person').textContent=p.alive?p.name:'Deceased';$('career').textContent=p.career.title;$('healthText').textContent=p.health;$('happyText').textContent=p.happiness;$('smartText').textContent=p.smarts;$('looksText').textContent=p.looks;$('healthBar').style.width=p.health+'%';$('happyBar').style.width=p.happiness+'%';$('smartBar').style.width=p.smarts+'%';$('looksBar').style.width=p.looks+'%';$('cash').textContent=money(p.cash);$('heat').textContent=p.heat+'%';
  const actions=[];actions.push(['Age Up',ageUp]);if(p.education.stage!=='none'&&p.education.stage!=='finished')actions.push(['Study Harder',study]);if(!p.rapper.active&&!p.footballer.active&&!p.adult.active&&!p.drug.active){if(p.age>=16)actions.push(['Become Rapper',()=>startCareer('rapper')],['Become Footballer',()=>startCareer('footballer')],['Sell Drugs',()=>startCareer('drug')]);if(p.age>=18)actions.push(['Adult Content',()=>startCareer('adult')])}if(p.rapper.active)actions.push(['Drop a Single',()=>special('drop')]);if(p.footballer.active)actions.push(['Train',()=>special('train')]);if(p.adult.active)actions.push(['Film Scene',()=>special('scene')]);if(p.drug.active){actions.push(['Move Product',()=>special('push')],['Launder Money',()=>special('launder')])}for(const c of crimes)if(p.age>=c.age)actions.push([c.name,()=>crime(c.id)]);if(p.pendingTrial)actions.push(['Go to Trial',()=>trial(false)],['Hire Elite Lawyer',()=>trial(true)]);
  $('actions').innerHTML='';for(const [text,fn]of actions){const b=document.createElement('button');b.className='action';b.textContent=text;b.onclick=()=>{if(p.alive)fn()};$('actions').appendChild(b)}$('timeline').innerHTML=p.log.map(x=>`<div class="log">${escapeText(x)}</div>`).join('')}
function escapeText(v){const d=document.createElement('span');d.textContent=String(v);return d.innerHTML}
$('newLife').onclick=create;create();
})();
</script>
</body>
</html>
